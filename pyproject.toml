[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-process-optimization"
version = "0.3.0"
description = "Industrial manufacturing optimization case studies with dual-scale reproducible fixtures"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
