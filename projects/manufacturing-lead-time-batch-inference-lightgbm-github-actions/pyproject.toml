[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-lead-time-batch-inference"
version = "0.1.0"
description = "Production-style LightGBM batch inference with GitHub Actions."
requires-python = ">=3.12"
dependencies = [
  "joblib>=1.5,<2",
  "lightgbm==4.7.0",
  "mapie==1.5.0",
  "numpy>=2.2,<3",
  "pandas==3.0.5",
  "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
