name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Lint supplementary case studies
        run: ruff check src/manufacturing_process_optimization examples tests/test_case0?.py tests/test_case10.py
      - run: pytest
      - name: Export labeled validation-demo evidence
        run: python -m manufacturing_optimization.experiment_evidence --output artifacts/manufacturing-demo-evidence.json
      - name: Upload validation evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-demo-evidence
          path: artifacts/manufacturing-demo-evidence.json
          if-no-files-found: error
          retention-days: 14
