name: Integrated Production Maintenance Planning

on:
  push:
    branches: [main]
    paths:
      - "projects/integrated-production-maintenance-capacity-planning/**"
      - ".github/workflows/production-maintenance-planning.yml"
  pull_request:
    paths:
      - "projects/integrated-production-maintenance-capacity-planning/**"
      - ".github/workflows/production-maintenance-planning.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11","3.12"]
    defaults:
      run:
        working-directory: projects/integrated-production-maintenance-capacity-planning
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
